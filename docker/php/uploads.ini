; spatialGE upload limits.
;
; The official php:* images activate NO php.ini, so PHP falls back to
; compiled-in defaults (upload_max_filesize=2M, post_max_size=8M) which are
; far too small for Visium/CosMx expression matrices and hires tissue images.
; Without this file, oversized POSTs are silently discarded by PHP before
; Laravel boots: $_FILES is empty, SampleController::store() skips its upload
; block and still returns HTTP 200, so the UI reloads having created nothing.
;
; Invariant to preserve: memory_limit >= post_max_size >= upload_max_filesize

upload_max_filesize = 2G
post_max_size = 2G
memory_limit = 2G

; 4 files per sample (expression, coordinates, image, scale) + headroom
max_file_uploads = 40

; Large uploads take time to receive and move into place.
; 0 = no limit; raise rather than disable if you prefer a ceiling.
max_execution_time = 0
max_input_time = -1
